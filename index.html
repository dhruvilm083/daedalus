<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daedalus Productions</title>
<meta name="description" content="Projects by daedalus productions.">
<link rel="canonical" href="https://daedalusproductions.vercel.app/">
<meta property="og:title" content="daedalus productions">
<meta property="og:url" content="https://daedalusproductions.vercel.app/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap">
<style>
/* Layout: header, one infinite sliding lightbox of live-site previews with an italic caption, footer. Nothing else. */
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --ink: #111213;
  --muted: #6d6f73;
  --line: #e3e3e0;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.65,0,.2,1);
  --slide: min(72vw, 1000px, calc((100vh - 280px) * 1.6));
  --gap: clamp(16px, 3vw, 40px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0d0e10; --surface: #16171a; --ink: #ececea; --muted: #8b8d92; --line: #26272b; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0d0e10; --surface: #16171a; --ink: #ececea; --muted: #8b8d92; --line: #26272b; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; font-optical-sizing: auto;
  display: flex; flex-direction: column; min-height: 100%; overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 6px; }

.edge {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding-block: 28px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.word { font-weight: 600; letter-spacing: -0.01em; }
.muted { color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- lightbox ---------- */
.box { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding-block: 24px; min-height: 0; }
.track { position: relative; height: calc(var(--slide) * 10 / 16); touch-action: pan-y; user-select: none; }
.slide {
  position: absolute; top: 0; left: 50%; width: var(--slide); height: 100%;
  margin-left: calc(var(--slide) / -2);
  transition: transform .8s var(--ease), opacity .8s var(--ease);
  will-change: transform;
}
.slide.jump { transition: none; }
.shot {
  display: block; width: 100%; height: 100%; border-radius: 12px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 30px 60px -30px rgb(0 0 0 / .25);
}
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; pointer-events: none; }
.shot .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: clamp(24px, 4vw, 48px); font-weight: 500; letter-spacing: -0.03em; }
.slide:not(.on) { opacity: .35; cursor: pointer; }
.slide:not(.on) .shot { pointer-events: none; }

.cap {
  margin: 28px auto 0; text-align: center; font-style: italic; font-size: 16px; color: var(--muted);
  min-height: 1.5em; transition: opacity .4s ease;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.cap b { font-weight: 500; color: var(--ink); }
.cap a { transition: color .2s; }
.cap a:hover { color: var(--ink); }
.cap.fade { opacity: 0; }

@media (max-width: 640px) {
  :root { --slide: 84vw; --gap: 12px; }
  .edge { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .slide, .cap { transition: none; }
}
</style>
</head>
<body>

<header class="edge">
  <span class="word">daedalus productions</span>
  <span class="muted" id="count"></span>
</header>

<main class="box" aria-roledescription="carousel" aria-label="daedalus productions projects">
  <div class="track" id="track"></div>
  <p class="cap" id="cap" aria-live="polite"></p>
</main>

<footer class="edge muted">
  <span>made with ❤️ by daedalus productions</span>
  <span>© 2026</span>
</footer>

<script>
// One entry per project. Leave `url` empty for one that hasn't launched.
const PROJECTS = [
  { id: "calendai", name: "calendAI", url: "https://calendai.ca", cap: "plans, from a screenshot", shot: "shots/calendai.png" },
  { id: "scrapify", name: "Scrapify", url: "https://scrapify-akdm.vercel.app", cap: "job alerts, by text", shot: "shots/scrapify.png" },
  { id: "statusofai", name: "status of ai", url: "https://statusofai.vercel.app", cap: "can ai do it yet?", shot: "shots/statusofai.png" },
  { id: "dmphotos", name: "dmphotos", url: "https://dmphotos.ca", cap: "photographs", shot: "shots/dmphotos.png" },
  { id: "washtag", name: "Washtag", url: "https://washtag-green.vercel.app", cap: "laundry labels, decoded", shot: "shots/washtag.png" }
];

const track = document.getElementById("track"), cap = document.getElementById("cap");
const n = PROJECTS.length;
document.getElementById("count").textContent = n + " projects";

const slides = PROJECTS.map((p, i) => {
  const s = document.createElement("div");
  s.className = "slide";
  s.dataset.i = i;
  const inner = p.url ? document.createElement("a") : document.createElement("div");
  inner.className = "shot";
  if (p.url) { inner.href = p.url; inner.target = "_blank"; inner.rel = "noopener"; inner.setAttribute("aria-label", "Open " + p.name); }
  const ph = () => { inner.innerHTML = `<div class="ph">${p.name.toLowerCase()}</div>`; };
  if (p.shot) {
    const img = new Image(); img.alt = p.name; img.src = p.shot; img.draggable = false;
    img.onerror = ph; inner.appendChild(img);
  } else ph();
  s.appendChild(inner);
  s.addEventListener("click", () => { if (i !== cur) go(i); });
  track.appendChild(s);
  return s;
});

let cur = 0;
const prevOffset = new Array(n).fill(null);
function render() {
  slides.forEach((s, i) => {
    let d = ((i - cur) % n + n) % n;
    if (d > n / 2) d -= n;
    s.classList.toggle("jump", prevOffset[i] !== null && Math.abs(d - prevOffset[i]) > 1);
    prevOffset[i] = d;
    s.style.transform = `translateX(calc(${d} * (var(--slide) + var(--gap))))`;
    s.style.zIndex = 10 - Math.abs(d);
    s.classList.toggle("on", d === 0);
    s.setAttribute("aria-hidden", d === 0 ? "false" : "true");
    s.querySelector("a")?.setAttribute("tabindex", d === 0 ? "0" : "-1");
  });
  const p = PROJECTS[cur];
  cap.classList.add("fade");
  setTimeout(() => { cap.innerHTML = p.url ? `<a href="${p.url}" target="_blank" rel="noopener"><b>${p.name}</b>, ${p.cap} ↗</a>` : `<b>${p.name}</b>, ${p.cap}`; cap.classList.remove("fade"); }, 200);
}
function go(i) { cur = ((i % n) + n) % n; render(); restart(); }

// autoplay, paused while hovering or focused inside the lightbox
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let timer = null, held = false;
function restart() { clearInterval(timer); if (!reduce && !held) timer = setInterval(() => { cur = (cur + 1) % n; render(); }, 4500); }
track.addEventListener("mouseenter", () => { held = true; restart(); });
track.addEventListener("mouseleave", () => { held = false; restart(); });
document.addEventListener("visibilitychange", () => { held = document.hidden; restart(); });

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
});

// swipe
let x0 = null, swiped = false;
track.addEventListener("pointerdown", (e) => { x0 = e.clientX; swiped = false; });
track.addEventListener("pointerup", (e) => {
  if (x0 === null) return;
  const dx = e.clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) { swiped = true; go(cur + (dx < 0 ? 1 : -1)); }
});
track.addEventListener("click", (e) => { if (swiped) { e.preventDefault(); e.stopPropagation(); swiped = false; } }, true);

render();
restart();
</script>
</body>
</html>
