<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daedalus Productions</title>
<meta name="description" content="Projects by daedalus productions.">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://daedalus.productions/">
<meta property="og:title" content="daedalus productions">
<meta property="og:url" content="https://daedalus.productions/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap">
<style>
/* Layout: header, one infinite sliding lightbox of live-site previews with an italic caption, footer. Nothing else.
   Always dark: there is no light mode. */
:root {
  color-scheme: dark;
  --bg: #0d0e10;
  --surface: #16171a;
  --ink: #ececea;
  --muted: #8b8d92;
  --line: #26272b;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.65,0,.2,1);
  --slide: min(72vw, 1000px, calc((100vh - 330px) * 1.6));
  --green: #4ade80;
  --gap: clamp(16px, 3vw, 40px);
  --glow-strength: 20%;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; font-optical-sizing: auto;
  display: flex; flex-direction: column; min-height: 100%; overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 6px; }

/* Corner text sits the same distance from the top (or bottom) edge as from the side edge. */
.edge {
  --edge: 24px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding-block: var(--edge); line-height: 1;
  padding-left: max(var(--edge), env(safe-area-inset-left, 0px));
  padding-right: max(var(--edge), env(safe-area-inset-right, 0px));
}
.edge > * { text-box: trim-both cap alphabetic; }
.word { font-weight: 600; letter-spacing: -0.01em; }
.muted { color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- tools | pages ---------- */
.tabs { display: flex; justify-content: center; gap: 28px; margin: 0 0 28px; }
.tabs button {
  font: inherit; font-size: 16px; font-weight: 500; color: var(--muted); background: none; border: 0; padding: 4px 2px; cursor: pointer;
  text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 1.5px; text-underline-offset: 7px;
  transition: color .25s, text-decoration-color .25s;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--green); text-decoration-color: var(--green); }
.track.swap .shot { transition-duration: .25s; transition-delay: 0s; }

/* ---------- lightbox ---------- */
/* spotlight in the colour of each site's footer heart; --glow is set per slide from script */
@property --glow { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --glow2 { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --glow3 { syntax: "<color>"; inherits: true; initial-value: transparent; }
/* The glow is one soft oval halo behind the whole page, centred on the slide (--glow-y), so it can spread past the header and footer. */
body { isolation: isolate; transition: --glow 1.2s ease, --glow2 1.2s ease, --glow3 1.2s ease; }
body.quick { transition-duration: .4s; }
.glow {
  position: fixed; z-index: -1; pointer-events: none;
  left: 50%; top: var(--glow-y, 50%);
  width: calc(var(--slide) * 1.3); height: calc(var(--slide) * 10 / 16 * 1.45);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  /* bottom to top: --glow, --glow2, --glow3 (all the same colour unless a project gives a gradient) */
  background: linear-gradient(to top,
    color-mix(in srgb, var(--glow) calc(var(--glow-strength) * 1.1), transparent) 15%,
    color-mix(in srgb, var(--glow2) calc(var(--glow-strength) * 1.1), transparent) 50%,
    color-mix(in srgb, var(--glow3) calc(var(--glow-strength) * 1.1), transparent) 85%);
  filter: blur(clamp(60px, 9vw, 140px));
}
.box { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding-block: 24px; min-height: 0; }
.track { position: relative; height: calc(var(--slide) * 10 / 16); touch-action: pan-y; user-select: none; }
.slide {
  position: absolute; top: 0; left: 50%; width: var(--slide); height: 100%;
  margin-left: calc(var(--slide) / -2);
  transition: transform .8s var(--ease), opacity .8s var(--ease);
  will-change: transform;
}
/* clicks, keys and swipes move about three times faster than the autoplay glide */
body.quick .slide { transition-duration: .4s; }
.slide.jump { transition: none; }
.shot {
  display: block; width: 100%; height: 100%; border-radius: 12px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 30px 60px -30px rgb(0 0 0 / .25);
  transition: opacity .9s ease var(--enter-delay, 0s), transform 1s var(--ease) var(--enter-delay, 0s);
}
/* entrance: slides start in place but hidden, then rise and fade in from the centre outwards */
.track:not(.ready) .shot { opacity: 0; transform: translateY(16px) scale(.985); }
.track:not(.ready) ~ .cap { opacity: 0; }
.shot img, .shot video { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; pointer-events: none; }
.shot .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: clamp(24px, 4vw, 48px); font-weight: 500; letter-spacing: -0.03em; }
.slide:not(.on) { opacity: .35; cursor: pointer; }
.slide.on .shot { box-shadow: 0 30px 90px -30px color-mix(in srgb, var(--glow) 55%, rgb(0 0 0 / .25)); }
.slide:not(.on) .shot { pointer-events: none; }

.cap {
  margin: 28px auto 0; text-align: center; font-style: italic; font-size: 16px; color: var(--muted);
  min-height: 1.5em; transition: opacity .4s ease;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.cap b { font-weight: 500; color: var(--ink); }
.cap a { transition: color .2s; }
.cap a:hover { color: var(--ink); }
.cap.fade { opacity: 0; }
body.quick .cap { transition-duration: .15s; }

@media (max-width: 640px) {
  :root { --slide: 84vw; --gap: 12px; }
  .edge { --edge: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .slide, .cap, .shot { transition: none !important; }
}
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>
<header class="edge">
  <span class="word">daedalus productions</span>
  <span class="muted" id="count"></span>
</header>

<main class="box" aria-roledescription="carousel" aria-label="daedalus productions projects">
  <nav class="tabs" role="tablist" aria-label="Project type">
    <button role="tab" id="tab-tools" data-kind="tool" aria-selected="true">tools</button>
    <button role="tab" id="tab-pages" data-kind="page" aria-selected="false">pages</button>
  </nav>
  <div class="track" id="track"></div>
  <p class="cap" id="cap" aria-live="polite"></p>
</main>

<footer class="edge muted">
  <span>made with ❤️ by daedalus</span>
  <span>© 2026</span>
</footer>

<script>
// One entry per project. Leave `url` empty for one that hasn't launched.
// `kind` is "tool" or "page": which tab it sits under.
// `heart` is the colour of the heart in that site's footer; it tints the spotlight behind its slide.
// `heart` can also be a list of up to three colours, bottom to top, for a gradient glow.
// `video` is an optional looping clip shown instead of the still; it plays only while centred.
// `intro` makes the clip play once from the top each time the slide arrives (a site's opening animation) instead of looping.
const PROJECTS = [
  { id: "calendai", kind: "tool", name: "calendAI", url: "https://calendai.ca", heart: "#a855f7", cap: "plans, from a screenshot", shot: "shots/calendai.png" },
  { id: "scrapify", kind: "tool", name: "Scrapify", url: "https://scrapify-akdm.vercel.app", heart: "#4ade80", cap: "job alerts, by text", shot: "shots/scrapify.png" },
  { id: "washtag", kind: "tool", name: "Washtag", url: "https://washtag.app", heart: "#2563eb", cap: "laundry day, planned", shot: "shots/washtag.png" },
  { id: "natocuas", kind: "tool", name: "NATO CUAS", url: "https://nato-cuas.vercel.app", heart: ["#dc2626", "#f97316", "#fbbf24"], cap: "drone tracking, mapped", shot: "shots/natocuas.png" },
  { id: "makeachangehomes", kind: "page", name: "Make a Change Homes", url: "https://makeachangehomes.ca", heart: "#ffffff", cap: "a website build", shot: "shots/makeachangehomes.png", video: "shots/makeachangehomes.mp4", intro: true },
  { id: "statusofai", kind: "page", name: "status of ai", url: "https://statusofai.vercel.app", heart: "#facc15", cap: "can ai do it yet?", shot: "shots/statusofai.png", video: "shots/statusofai.mp4" },
  { id: "dmphotos", kind: "page", name: "dmphotos", url: "https://dmphotos.ca", heart: ["#232833", "#566074", "#a4adbf"], cap: "photographs", shot: "shots/dmphotos.png" }
];

const box = document.querySelector(".box"), track = document.getElementById("track"), cap = document.getElementById("cap");
const tabs = [...document.querySelectorAll(".tabs button")];
const count = document.getElementById("count");

function makeSlide(p, i) {
  const s = document.createElement("div");
  s.className = "slide";
  s.dataset.i = i;
  const inner = p.url ? document.createElement("a") : document.createElement("div");
  inner.className = "shot";
  if (p.url) { inner.href = p.url; inner.target = "_blank"; inner.rel = "noopener"; inner.setAttribute("aria-label", "Open " + p.name); }
  const ph = () => { inner.innerHTML = `<div class="ph">${p.name.toLowerCase()}</div>`; };
  const still = () => {
    const img = new Image(); img.alt = p.name; img.src = p.shot; img.draggable = false;
    img.onerror = ph; inner.replaceChildren(img);
  };
  if (p.video) {
    // a short muted clip of the live site; falls back to the still if the clip can't play
    const v = document.createElement("video");
    Object.assign(v, { muted: true, loop: !p.intro, playsInline: true, preload: "auto", poster: p.shot || "" });
    v.setAttribute("aria-label", p.name);
    v.src = p.video;
    v.onerror = () => (p.shot ? still() : ph());
    inner.appendChild(v);
  } else if (p.shot) still();
  else ph();
  s.appendChild(inner);
  s.addEventListener("click", () => { if (i !== cur) go(i); });
  return s;
}

// the projects under the selected tab, and their slides
let list = [], slides = [], n = 0, prevOffset = [];
function build(kind) {
  list = PROJECTS.filter((p) => p.kind === kind);
  n = list.length;
  slides = list.map(makeSlide);
  track.replaceChildren(...slides);
  prevOffset = new Array(n).fill(null);
  cur = 0;
  count.textContent = n + (kind === "tool" ? " tools" : " pages");
  tabs.forEach((t) => t.setAttribute("aria-selected", String(t.dataset.kind === kind)));
}

let cur = 0;
function render() {
  slides.forEach((s, i) => {
    let d = ((i - cur) % n + n) % n;
    if (d > n / 2) d -= n;
    // first placement and wrap-arounds move instantly, so nothing slides in from a stack on load
    s.classList.toggle("jump", prevOffset[i] === null || Math.abs(d - prevOffset[i]) > 1);
    if (prevOffset[i] === null) s.style.setProperty("--enter-delay", `${Math.abs(d) * 0.12}s`);
    prevOffset[i] = d;
    s.style.transform = `translateX(calc(${d} * (var(--slide) + var(--gap))))`;
    s.style.zIndex = 10 - Math.abs(d);
    s.classList.toggle("on", d === 0);
    // clips play only while their slide is centred, starting from the top each time it arrives
    const v = s.querySelector("video");
    if (v && d === 0 && v.paused) { v.currentTime = 0; v.play().catch(() => {}); }
    else if (v && d !== 0 && !v.paused) v.pause();
    s.setAttribute("aria-hidden", d === 0 ? "false" : "true");
    s.querySelector("a")?.setAttribute("tabindex", d === 0 ? "0" : "-1");
  });
  const p = list[cur];
  const h = [].concat(p.heart || "transparent");
  ["--glow", "--glow2", "--glow3"].forEach((v, k) => document.body.style.setProperty(v, h[Math.min(k, h.length - 1)]));
  cap.classList.add("fade");
  setTimeout(() => { cap.innerHTML = p.url ? `<a href="${p.url}" target="_blank" rel="noopener"><b>${p.name}</b>, ${p.cap} ↗</a>` : `<b>${p.name}</b>, ${p.cap}`; cap.classList.remove("fade"); }, quick ? 70 : 200);
}
let quick = false;
const setQuick = (on) => { quick = on; document.body.classList.toggle("quick", on); };
function go(i) { setQuick(true); cur = ((i % n) + n) % n; render(); restart(); }

// autoplay, paused while hovering or focused inside the lightbox
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let timer = null, held = false;
function restart() { clearInterval(timer); if (!reduce && !held) timer = setInterval(() => { setQuick(false); cur = (cur + 1) % n; render(); }, 4500); }
track.addEventListener("mouseenter", () => { held = true; restart(); });
track.addEventListener("mouseleave", () => { held = false; restart(); });
document.addEventListener("visibilitychange", () => { held = document.hidden; restart(); });

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
});

// swipe
let x0 = null, swiped = false;
track.addEventListener("pointerdown", (e) => { x0 = e.clientX; swiped = false; });
track.addEventListener("pointerup", (e) => {
  if (x0 === null) return;
  const dx = e.clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) { swiped = true; go(cur + (dx < 0 ? 1 : -1)); }
});
track.addEventListener("click", (e) => { if (swiped) { e.preventDefault(); e.stopPropagation(); swiped = false; } }, true);

// keep the glow centred on the slide
const placeGlow = () => { const r = track.getBoundingClientRect(); document.body.style.setProperty("--glow-y", `${r.top + r.height / 2}px`); };
addEventListener("resize", placeGlow);
addEventListener("scroll", placeGlow, { passive: true });
placeGlow();

// reveal once the slides are in place and the centre image has had a moment to load
const reveal = () => requestAnimationFrame(() => requestAnimationFrame(() => {
  track.classList.remove("swap");
  track.classList.add("ready");
  setTimeout(() => slides.forEach((s) => s.style.removeProperty("--enter-delay")), 1600);
}));
function show(kind) {
  build(kind);
  setQuick(true);
  render();
  const img = slides[cur].querySelector("img");
  if (img && !img.complete) {
    const t = setTimeout(reveal, 600);
    img.addEventListener("load", () => { clearTimeout(t); reveal(); }, { once: true });
  } else reveal();
  restart();
}

// tools | pages: the old slides sink away quickly, then the new set rises in from the centre like on load
let kind = location.hash === "#pages" ? "page" : "tool", switching = null;
tabs.forEach((t) => t.addEventListener("click", () => {
  if (t.dataset.kind === kind) return;
  kind = t.dataset.kind;
  history.replaceState(null, "", kind === "page" ? "#pages" : "#tools");
  tabs.forEach((b) => b.setAttribute("aria-selected", String(b === t)));
  clearTimeout(switching);
  track.classList.add("swap");
  track.classList.remove("ready");
  switching = setTimeout(() => show(kind), reduce ? 0 : 260);
}));
show(kind);
</script>
</body>
</html>
