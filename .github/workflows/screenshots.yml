name: Screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/screenshots.mjs
      - name: Commit changed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add shots
          git diff --cached --quiet || (git commit -m "Update screenshots" && git push)
